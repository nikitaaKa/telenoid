<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Telegram Arkanoid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Полупрозрачный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            /* По умолчанию скрыто */
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
        }

        .modal-overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background-color: #2c3e50; /* Темно-синий, в стиле игры */
            color: #ecf0f1; /* Светлый текст */
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 24px;
        }

        .modal-content p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .modal-button {
            background-color: #3498db; /* Ярко-синий */
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Заголовок</h2>
            <p id="modal-text">Ваш счет: 0</p>
            <button id="modal-button" class="modal-button">ОК</button>
        </div>
    </div>
    <!-- Подключаем библиотеки -->
    <script src="phaser.min.js"></script>
    <script src="supabase.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script> <!-- Скрипт Telegram -->

    <!-- Подключаем наши сцены -->
    <script src="js/MainMenuScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/LeaderboardScene.js"></script>

    <!-- Подключаем главный файл, который запускает игру -->
    <script src="js/main.js"></script>
</body>
</html>
